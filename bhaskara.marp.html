<h2 id="curiosity-the-bhaskara-name">Curiosity: The &quot;Bhaskara&quot; Name</h2>
<h3 id="%F0%9F%87%A7%F0%9F%87%B7-%F0%9F%87%AE%F0%9F%87%B3-brazilian-uniqueness-%F0%9F%AA%87-%F0%9F%A5%BB"><img class="emoji" draggable="false" alt="🇧🇷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f1e7-1f1f7.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🇮🇳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f1ee-1f1f3.svg" data-marp-twemoji=""/> <strong>Brazilian Uniqueness</strong> <img class="emoji" draggable="false" alt="🪇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1fa87.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🥻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f97b.svg" data-marp-twemoji=""/></h3>
<ul>
<li>
<p>In Brazil, this formula is widely known as &quot;Bhaskara's Formula&quot;, named after the 12th-century Indian mathematician Bhaskara II.</p>
</li>
<li>
<p>Interestingly, this naming convention is unique to Brazil; in the rest of the world, it's simply the &quot;Quadratic Formula&quot;.</p>
</li>
</ul>
</section>
