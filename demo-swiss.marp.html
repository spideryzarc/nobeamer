<h2 id="design-philosophy--typography">Design Philosophy &amp; Typography</h2>
<p>The Swiss Style (International Typographic Style) rejects arbitrary decoration in favor of structural clarity, objective legibility, and geometric order:</p>
<ul>
<li><strong>Asymmetry</strong>: Flush-left, ragged-right typography establishes dynamic balance without optical centering.</li>
<li><strong>Extreme Contrast</strong>: Monumental uppercase titles paired with crisp body text and technical monospace.</li>
<li><strong>Physical Integration</strong>: Ink-bleed synthesis and multiply blend on warm uncoated paper texture (<code>nb_img/paper2.jpg</code>).</li>
</ul>
<p><img src="" alt="split" /></p>

<h3 id="architectural-features">Architectural Features</h3>
<ul>
<li><strong>Transparent Ground</strong>: No floating SaaS card; paper texture breathes through naturally.</li>
<li><strong>Anchor Border</strong>: 5px Swiss Red left rule + 1px hairline perimeter.</li>
<li><strong>Right Tag</strong>: Floating uppercase badge (<code>&gt; [TAG](#card)</code>).</li>
<li><strong>Auto-Scaling Title</strong>: <code>### &lt;!-- fit --&gt; Title</code> scales horizontally to fill the gap up to the tag margin.</li>
<li><strong>Academic Serif Body</strong>: Justified Literata serif with automatic hyphenation.</li>
<li><strong>Centered Math</strong>: Display equations stay centered.</li>
</ul>
</section>

<h2 id="authoring-card-modules">Authoring <code>#card</code> Modules</h2>
<p>Two supported header patterns for Swiss Cards:</p>
<h3 id="1-dynamic-auto-scaling-recommended">1. Dynamic Auto-Scaling (Recommended)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-quote">&gt; [<span class="hljs-string">THEOREM 01</span>](<span class="hljs-link">#card</span>)</span>
<span class="hljs-quote">&gt; ### &lt;!-- fit --&gt; Modular Invariance</span>
<span class="hljs-quote">&gt; Formal proof body text in academic serif.</span>
<span class="hljs-quote">&gt; $$\oint<span class="hljs-emphasis">_{\Gamma} \vec{F} \cdot d\vec{r} = 0$$
</span></span></code></pre>
<p>The tag paragraph <strong>must precede</strong> the <code>### &lt;!-- fit --&gt;</code> heading so the tag floats right and the title fills the remaining gap.</p>
<p><img src="" alt="split" /></p>
<h3 id="2-static-bold-header-fallback">2. Static Bold Header (Fallback)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-quote">&gt; [<span class="hljs-string">DEF 02</span>](<span class="hljs-link">#card</span>)</span>
<span class="hljs-quote">&gt; <span class="hljs-strong">**Coordinate Projection**</span></span>
<span class="hljs-quote">&gt; Standard bold heading with an architectural hairline divider underneath.</span>
</code></pre>
<blockquote>
<p><a href="#a"></a> <strong>Authoring Rule</strong><br />
Always write the tag anchor as <code>[TAG](#card)</code> (or <code>[TAG](#card-r)</code> for right alignment) as the first line of the blockquote. If omitted, the card renders without the badge.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="cols-2" data-theme="nobeamer-swiss" lang="pt-BR" class="cols-2" data-marpit-pagination="8" style="--paginate:true;--class:cols-2;--theme:nobeamer-swiss;" data-marpit-pagination-total="18" data-transition-back="{&quot;name&quot;:&quot;swiss&quot;}" data-transition="{&quot;name&quot;:&quot;swiss&quot;}" data-size="16:9">
<h2 id="flexible-card-workflows">Flexible Card Workflows</h2>
<p>The unified <code>#card</code> primitive flexibly replaces specialized step blocks for sequential workflows, syllabi, and methodology:</p>
<blockquote>
<p><a href="#card">01</a></p>
<h3 id="rational-layout">Rational Layout</h3>
<p>Establish orthogonal baseline and horizontal margin bounds.</p>
</blockquote>
<blockquote>
<p><a href="#card">02</a></p>
<h3 id="typographic-tension">Typographic Tension</h3>
<p>Set monumental title contrast against high-density data.</p>
</blockquote>
<p><img src="" alt="split" /></p>
<h3 id="workflow-syntax">Workflow Syntax</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-quote">&gt; [<span class="hljs-string">01</span>](<span class="hljs-link">#card</span>)</span>
<span class="hljs-quote">&gt; ### Step Identifier</span>
<span class="hljs-quote">&gt; Action description or methodology narrative.</span>
</code></pre>
<ul>
<li><strong>Unified Primitive</strong>: Eliminates redundant card styles in favor of one robust component.</li>
<li><strong>Custom Badges</strong>: Use <code>[01](#card)</code>, <code>[STEP 02](#card)</code>, or any semantic token.</li>
<li><strong>Header Flexibility</strong>: Choose auto-scaling <code>### &lt;!-- fit --&gt;</code>, standard <code>###</code>, or <code>**Bold**</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="cols-2" data-theme="nobeamer-swiss" lang="pt-BR" class="cols-2" data-marpit-pagination="9" style="--paginate:true;--class:cols-2;--theme:nobeamer-swiss;" data-marpit-pagination-total="18" data-transition-back="{&quot;name&quot;:&quot;swiss&quot;}" data-transition="{&quot;name&quot;:&quot;swiss&quot;}" data-size="16:9">
<h2 id="semantic-status-cards-i-a-s">Semantic Status Cards (<code>#i</code>, <code>#a</code>, <code>#s</code>)</h2>
<p>Modular status callouts for architectural and technical feedback:</p>
<blockquote>
<p><a href="#i"></a> <strong>Informational Bulletin (<code>#i</code>)</strong><br />
Neutral notice framed with a 4px solid black top border.</p>
</blockquote>
<blockquote>
<p><a href="#a"></a> <strong>Critical Constraint (<code>#a</code>)</strong><br />
High-priority warning with Swiss Red border and tinted ground.</p>
</blockquote>
<blockquote>
<p><a href="#s"></a> <strong>Empirical Validation (<code>#s</code>)</strong><br />
Verified result marked with a deep forest green border.</p>
</blockquote>
<p><img src="" alt="split" /></p>
<h3 id="alignment-anchors">Alignment Anchors</h3>
<p>Append <code>-l</code>, <code>-c</code>, or <code>-r</code> to set card width and alignment:</p>
<ul>
<li><strong>Left (48% width)</strong>: <code>[](#i)</code>, <code>[](#a)</code>, <code>[](#s)</code>, <code>[TAG](#card-l)</code></li>
<li><strong>Centered (60% width)</strong>: <code>[](#i-c)</code>, <code>[](#a-c)</code>, <code>[](#s-c)</code>, <code>[TAG](#card-c)</code></li>
<li><strong>Right (48% width)</strong>: <code>[](#i-r)</code>, <code>[](#a-r)</code>, <code>[](#s-r)</code>, <code>[TAG](#card-r)</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-quote">&gt; [<span class="hljs-string">TAG</span>](<span class="hljs-link">#card-l</span>)</span>
<span class="hljs-quote">&gt; ### Left Card (48%)</span>
<span class="hljs-quote">&gt; Aligned flush-left to the margin datum.</span>

<span class="hljs-quote">&gt; [<span class="hljs-string">TAG</span>](<span class="hljs-link">#card-r</span>)</span>
<span class="hljs-quote">&gt; ### Right Card (48%)</span>
<span class="hljs-quote">&gt; Aligned flush-right to the margin datum.</span>
</code></pre>
</section>

<h2 id="bento-dark-module-d">Bento Dark Module (<code>#d</code>)</h2>
<p>A high-contrast carbon black module (<code>#161514</code>) for primary theorems, core axioms, or dramatic callouts:</p>
<blockquote>
<p><a href="#d"></a> <strong>The Axiom of Form &amp; Content</strong><br />
<em>&quot;Design is the method of putting form and content together. Design is so simple, that's why it is so complicated.&quot;</em><br />
— Paul Rand</p>
<p>Inline parameters like <code>grid_ratio = 1.618</code> use dark monospace pills, while <strong>bold emphasis</strong> automatically inherits Swiss Red.</p>
</blockquote>
<p><img src="" alt="split" /></p>
<h3 id="markdown-syntax">Markdown Syntax</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-quote">&gt; [](<span class="hljs-link">#d</span>) <span class="hljs-strong">**Module Title**</span></span>
<span class="hljs-quote">&gt; Body text with high contrast.</span>
<span class="hljs-quote">&gt; <span class="hljs-strong">**Bold text**</span> appears in Swiss Red.</span>
<span class="hljs-quote">&gt; `Inline code` renders in a dark pill.</span>
</code></pre>
<blockquote>
<p><a href="#card">TIP</a> <strong>Contrast Strategy</strong><br />
Use at most one <code>#d</code> module per slide to maintain visual weight and avoid overpowering the light paper surface.</p>
</blockquote>

<h2 id="code-presentation--architecture">Code Presentation &amp; Architecture</h2>
<ul>
<li><strong>Clean Monospace</strong>: High-legibility <code>IBM Plex Mono</code> with zero skeuomorphic scanlines or glow.</li>
<li><strong>Structural Left Rule</strong>: 4px black accent rule with a top-right <code>CODE</code> metadata indicator.</li>
<li><strong>Scrollable Containers</strong>: Wrap long code in <code>&lt;div class=&quot;code-scroll&quot;&gt;</code> for uncompressed scrolling.</li>
</ul>
<div class="code-scroll">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Swiss Layout Computation Engine</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">calculate_modular_bounds</span>(<span class="hljs-params">canvas_w: <span class="hljs-built_in">int</span> = <span class="hljs-number">1920</span>, cols: <span class="hljs-built_in">int</span> = <span class="hljs-number">12</span></span>) -&gt; <span class="hljs-built_in">dict</span>:
    <span class="hljs-string">&quot;&quot;&quot;Calculates column widths adhering to Swiss grid discipline.&quot;&quot;&quot;</span>
    margin_x = <span class="hljs-number">56</span>
    gutter = <span class="hljs-number">48</span>
    usable = canvas_w - (<span class="hljs-number">2</span> * margin_x)
    col_w = (usable - (cols - <span class="hljs-number">1</span>) * gutter) / cols
    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;col_width&quot;</span>: <span class="hljs-built_in">round</span>(col_w, <span class="hljs-number">2</span>), <span class="hljs-string">&quot;gutter&quot;</span>: gutter}
</code></pre>
</div>

<h2 id="theme-parameterization---accent">Theme Parameterization (<code>--accent</code>)</h2>
<p>The entire theme color identity is parameterized by a single CSS custom property <code>--accent</code> (default Swiss Red <code>#E30613</code>):</p>
<ul>
<li><strong>Global Override (Frontmatter)</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">style:</span> <span class="hljs-string">&quot;:root { --accent: #0066CC; }&quot;</span>
</code></pre>
</li>
<li><strong>Per-Slide Override (Slide Directive)</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">&lt;!-- <span class="hljs-emphasis">_style: &quot;--accent: #0066CC;&quot; --&gt;
</span></code></pre>
</li>
</ul>
<p>Zero utility classes required. All primary highlights inherit <code>--accent</code> dynamically.</p>

<h3 id="strict-design-guidelines">Strict Design Guidelines</h3>
<ul>
<li><strong>No decorative icons or emojis</strong>: Swiss modernism relies strictly on typography and numerical identifiers (<code>01 / STEP</code>, <code>[DEF]</code>).</li>
<li><strong>No rounded corners or drop shadows</strong>: Flat geometry respects the physical sheet with zero skeuomorphism.</li>
<li><strong>No centered body text</strong>: Maintain disciplined flush-left, ragged-right rhythm for maximum legibility.</li>
<li><strong>Controlled bold emphasis</strong>: Contrast relies on monumental scale differential rather than pervasive bolding.</li>
</ul>
